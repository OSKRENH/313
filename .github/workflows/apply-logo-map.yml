name: Apply header logo and project map

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Apply layout changes
        run: python scripts/add_logo_map.py
      - name: Validate references
        run: |
          grep -q 'id="geography"' index.html
          grep -q 'assets/projects-map.svg' index.html
          grep -q '313 header logo reveal and project map' hero-tilda.css
      - name: Commit generated site files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html hero-tilda.css
          if ! git diff --cached --quiet; then
            git commit -m "Show header logo on scroll and add project map"
            git push origin HEAD:${{ github.head_ref }}
          fi
