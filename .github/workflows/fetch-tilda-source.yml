name: Fetch Tilda source once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fetch-tilda-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download original Tilda HTML
        run: python scripts/fetch_tilda_source.py
      - name: Commit source snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug/tilda-source.html
          if ! git diff --cached --quiet; then
            git commit -m "Fetch original Tilda source"
            git push
          fi
