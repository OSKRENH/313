name: Extract Tilda SVG candidates once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/extract-logo-candidates.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract and download SVG candidates
        run: python scripts/extract_logo_candidates.py
      - name: Commit candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug/logo-candidates.md debug/logo-candidates
          if ! git diff --cached --quiet; then
            git commit -m "Extract original Tilda SVG candidates"
            git push
          fi
