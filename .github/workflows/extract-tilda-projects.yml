name: Extract Tilda project galleries

on:
  push:
    branches: [main]
    paths:
      - scripts/extract_tilda_projects.py
      - .github/workflows/extract-tilda-projects.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract project galleries
        run: python scripts/extract_tilda_projects.py
      - name: Commit extracted data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug/tilda-projects.json debug/tilda-source.html
          if ! git diff --cached --quiet; then
            git commit -m "Extract Tilda project gallery data"
            git push
          fi
