name: Build final 313 site fixes

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Install parser
        run: python -m pip install beautifulsoup4
      - name: Build project data and responsive assets
        run: python scripts/build_final_site.py
      - name: Validate JavaScript
        run: node --check script.js
      - name: Commit generated site files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js hero-tilda.css assets/hero-pattern.svg assets/hero-pattern-mobile.svg
          if ! git diff --cached --quiet; then
            git commit -m "Fix mobile layout and restore full project galleries"
            git push origin HEAD:${{ github.head_ref }}
          fi
