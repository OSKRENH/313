name: Extract Tilda project galleries

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract project galleries
        run: python scripts/extract_tilda_projects.py
      - name: Upload extracted data
        uses: actions/upload-artifact@v4
        with:
          name: tilda-project-data
          path: |
            debug/tilda-projects.json
            debug/tilda-source.html
          retention-days: 1
