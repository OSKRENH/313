name: Install original Tilda logo once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-tilda-logo.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install exact SVG and remove screenshot text
        run: python scripts/finalize_tilda_logo.py
      - name: Commit final site changes and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Use original Tilda SVG logo and remove projects intro"
            git push
          fi
